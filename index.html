<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>PayFlow – Payroll Automation</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#f2f5f3;--card:#fff;--tx:#13211d;--mu:#5d6f69;--bd:#e0e7e3;--pr:#0b6b58;--ok:#15803d;--bad:#dc2626;--wa:#b45309;--sb:#0d1f1b;--in:#f6f9f7;--am:#f2b441;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0a1512;--card:#111f1b;--tx:#e6efeb;--mu:#94a8a1;--bd:#1f332d;--pr:#0f8f76;--sb:#06100d;--in:#0d1a16}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0a1512;--card:#111f1b;--tx:#e6efeb;--mu:#94a8a1;--bd:#1f332d;--pr:#0f8f76;--sb:#06100d;--in:#0d1a16}
html,body{height:100%;margin:0}*{box-sizing:border-box}
body{background:var(--bg);color:var(--tx);font:14px/1.5 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
:focus-visible{outline:2px solid var(--pr);outline-offset:2px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.app{display:none;min-height:100%}
aside{width:248px;background:var(--sb);color:#a9bdb6;padding:20px 14px;flex:none;position:sticky;top:0;height:100vh}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px;color:#fff;padding:2px 10px 24px}.logo b{color:var(--am)}
.mk{width:34px;height:34px;border-radius:10px;background:var(--pr);display:grid;place-items:center;color:#fff}
aside button{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;color:inherit;padding:11px 12px;border-radius:12px;font:inherit;font-weight:500;cursor:pointer;text-align:left;margin-bottom:3px;transition:background .15s}
aside button:hover{background:#17302a;color:#fff}aside button.on{background:var(--pr);color:#fff;font-weight:600}
.wrap{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 32px;border-bottom:1px solid var(--bd);background:var(--card);position:sticky;top:0;z-index:5}
.top .co{font-weight:700}.usr{display:flex;align-items:center;gap:10px;color:var(--mu)}
.av{width:30px;height:30px;border-radius:99px;background:var(--am);color:#3a2a05;font-weight:800;display:grid;place-items:center;text-transform:uppercase}
main{padding:28px 32px 40px;max-width:1240px;margin:0 auto}
h1{margin:0 0 18px;font-size:28px;letter-spacing:-.02em;font-weight:800}h3{margin:0 0 12px;font-size:16px;font-weight:700}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:18px;overflow-x:auto}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:18px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:18px}.stat small{color:var(--mu);font-weight:500}.stat div{font-size:26px;font-weight:800;margin-top:6px;letter-spacing:-.02em}
.stat:last-child{background:var(--pr);border-color:var(--pr);color:#fff;grid-column:1/-1;order:-1}.stat:last-child small{color:#cfeee6}.stat:last-child div{font-size:34px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
input,select{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:10px;background:var(--in);color:var(--tx);font:inherit}
input:focus,select:focus{border-color:var(--pr);outline:0;box-shadow:0 0 0 3px color-mix(in srgb,var(--pr) 25%,transparent)}
label{font-size:12px;font-weight:600;color:var(--mu);display:block;margin-bottom:4px}
.btn{background:var(--pr);color:#fff;border:0;border-radius:10px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer;transition:filter .15s}.btn:hover{filter:brightness(1.1)}
.btn.s{background:var(--in);color:var(--tx);border:1px solid var(--bd)}.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}.btn.r{background:var(--bad)}.btn.o{background:var(--ok)}.btn.sm{padding:6px 11px;font-size:12px}
table{width:100%;border-collapse:collapse;min-width:520px}th,td{text-align:left;padding:11px 10px;border-bottom:1px solid var(--bd);white-space:nowrap}tr:last-child td{border-bottom:0}th{color:var(--mu);font-size:12px;font-weight:600;background:var(--in)}
td input,td select{padding:7px 9px;min-width:100px}.r{text-align:right}
.tag{padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--in);border:1px solid var(--bd)}
.Approved{color:var(--ok)}.Rejected{color:var(--bad)}.Pending{color:var(--wa)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.mu{color:var(--mu)}
#modal{position:fixed;inset:0;background:rgba(2,10,8,.65);display:none;overflow:auto;padding:20px;z-index:20}
.mbox{max-width:680px;margin:0 auto}.bar{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.slip{background:#fff;color:#13211d;border-radius:14px;padding:26px;margin-bottom:14px;page-break-after:always}
.slip h2{margin:0;font-size:20px;color:#0b6b58}.slip table{min-width:0}.slip td,.slip th{border-color:#e0e7e3;color:#13211d;background:none}
.slip .net{background:#e7f5f0;font-weight:700;font-size:16px}
#login{position:fixed;inset:0;display:grid;grid-template-columns:1.1fr 1fr;background:var(--bg);z-index:30;overflow:auto}
.lb{background:var(--sb);color:#cfe0da;padding:48px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.lb h2{font-size:40px;line-height:1.1;letter-spacing:-.03em;color:#fff;margin:0 0 14px;max-width:14ch}.lb p{max-width:40ch;margin:0;color:#a9bdb6;font-size:16px}
.lb ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}.lb li{display:flex;gap:10px;align-items:center}.lb li svg{color:var(--am)}
.lf{display:grid;place-items:center;padding:32px}.lf form{width:100%;max-width:380px}
.lf h1{font-size:26px;margin-bottom:6px}.lf .fld{margin-bottom:14px}.lf .btn{width:100%;padding:12px}
.pw{position:relative}.pw input{padding-right:46px}.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--mu);cursor:pointer;padding:8px;display:grid;border-radius:8px}.eye:hover{color:var(--tx)}.lk{background:none;border:0;color:var(--pr);font:inherit;font-weight:700;cursor:pointer;padding:0}.hint{text-align:center;color:var(--mu);margin:10px 0 0;font-size:13px}
.warn{display:none;background:#fef3c7;color:#78350f;padding:10px 32px;font-weight:500}.warn.on{display:block}
.err{color:var(--bad);min-height:20px;margin:0 0 10px;font-weight:500}
@media(max-width:1099px){aside{width:76px;padding:20px 10px}aside .t,.logo span.t{display:none}aside button{justify-content:center;padding:13px}.logo{justify-content:center;padding:2px 0 22px}.top{padding:14px 24px}main{padding:24px}}
@media(max-width:760px){.app{flex-direction:column}
aside{position:fixed;bottom:0;left:0;right:0;top:auto;width:100%;height:auto;display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:10;border-top:1px solid #17302a}
.logo{display:none}#nav{display:flex;width:100%;gap:2px}
aside button{flex-direction:column;gap:3px;padding:7px 2px;font-size:10.5px;margin:0;flex:1;min-width:0}aside .t{display:block;font-size:10.5px}
.top{padding:12px 16px}.warn{padding:10px 16px}.usr span.n{display:none}main{padding:18px 14px 96px}h1{font-size:24px}.card{padding:16px}.stats{grid-template-columns:1fr 1fr;gap:10px}.stat:nth-child(3){grid-column:1/-1}.stat:last-child div{font-size:28px}
input,select{font-size:16px}#login{grid-template-columns:1fr}.lb{padding:28px 22px;gap:18px}.lb h2{font-size:28px}.lb ul{display:none}.lf{padding:24px 18px}}
@media print{.app,.bar,#login{display:none!important}#modal{position:static;background:none;padding:0;display:block!important}.slip{border-radius:0;margin:0}}
</style></head><body>
<div id="login"></div>
<div class="app"><aside><div class="logo"><div class="mk"><svg class="i" viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/></svg></div><span class="t">Pay<b>Flow</b></span></div><div id="nav"></div></aside><div class="wrap"><header class="top"><div class="co" id="co"></div><div class="usr"><div class="av" id="av"></div><span class="n" id="un"></span><button class="btn s sm" onclick="out()">Sign out</button></div></header><div class="warn" id="wn"></div><main id="main"></main></div></div>
<div id="modal"><div class="mbox"><div class="bar"><button class="btn" onclick="window.print()">Print / Save as PDF</button><button class="btn s" onclick="$('#modal').style.display='none'">Close</button></div><div id="slips"></div></div></div>
<script>
const $=q=>document.querySelector(q),K='payflow1';
const e=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const m=n=>'₱'+Number(n||0).toLocaleString('en-PH',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const tm=t=>{if(!t)return null;const a=t.split(':');return +a[0]*60+ +a[1]};
let S=null;try{S=JSON.parse(localStorage.getItem(K))}catch(x){}
if(!S)S={co:'My Company',set:{start:'09:00',cred:15,sss:5,ph:2.5,pi:2},nid:4,att:{},lv:[],emps:[
{id:1,name:'Juan Dela Cruz',pos:'Staff',email:'juan@example.com',rate:600},
{id:2,name:'Maria Santos',pos:'Accountant',email:'maria@example.com',rate:750},
{id:3,name:'Pedro Reyes',pos:'Driver',email:'pedro@example.com',rate:550}]};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(x){}};
let V='dash',MO=fmt(new Date()).slice(0,7),DT=fmt(new Date()),EDIT=null,DEL=null;
const emp=id=>S.emps.find(x=>x.id==id);
function days(f,t){const o=[];let d=new Date(f+'T00:00'),z=new Date(t+'T00:00');while(d<=z){if(d.getDay()%6)o.push(fmt(d));d.setDate(d.getDate()+1)}return o}
const tx=x=>x<=20833?0:x<=33333?(x-20833)*.15:x<=66667?1875+(x-33333)*.2:x<=166667?8542+(x-66667)*.25:33542+(x-166667)*.3;
function calc(p,mo){let P=0,ot=0,late=0,L=0;const pd=new Set();
for(const d in S.att){if(d.slice(0,7)!==mo)continue;const r=S.att[d][p.id];if(!r||r.st!=='P')continue;P++;pd.add(d);const i=tm(r.in),o=tm(r.out);if(i!=null&&o!=null){ot+=Math.max(0,(o-i-60)/60-8);late+=Math.max(0,i-tm(S.set.start))}}
S.lv.forEach(l=>{if(l.eid==p.id&&l.st==='Approved')days(l.f,l.t).forEach(d=>{if(d.slice(0,7)===mo&&!pd.has(d)){L++;pd.add(d)}})});
const r=+p.rate,basic=(P+L)*r,otp=ot*r/8*1.25,ld=late*r/480,gross=basic+otp-ld,work=P+L>0;
const sss=work?Math.min(Math.max(r*26,5000),35000)*S.set.sss/100:0,ph=work?Math.min(Math.max(r*26,10000),100000)*S.set.ph/100:0,pi=work?Math.min(r*26,10000)*S.set.pi/100:0;
const tax=Math.max(0,tx(gross-sss-ph-pi)),d0=sss+ph+pi+tax,k=d0>0&&d0>gross?Math.max(0,gross)/d0:1;
return{P,L,ot,late,basic,otp,ld,gross,sss:sss*k,ph:ph*k,pi:pi*k,tax:tax*k,ded:d0*k,net:gross-d0*k}}
function bal(id){const y=new Date().getFullYear()+'';let u=0;S.lv.forEach(l=>{if(l.eid==id&&l.st==='Approved'&&l.f.slice(0,4)===y)u+=days(l.f,l.t).length});return S.set.cred-u}
const mlabel=mo=>new Date(mo+'-01T00:00').toLocaleDateString('en-US',{month:'long',year:'numeric'});
const VW={
dash(){const t=S.att[fmt(new Date())]||{};const pr=Object.values(t).filter(r=>r.st==='P').length;const pend=S.lv.filter(l=>l.st==='Pending').length;const tot=S.emps.reduce((a,p)=>a+calc(p,MO).net,0);
return `<h1>Dashboard</h1><div class="stats"><div class="stat"><small>Employees</small><div>${S.emps.length}</div></div><div class="stat"><small>Present today</small><div>${pr}</div></div><div class="stat"><small>Pending leave requests</small><div>${pend}</div></div><div class="stat"><small>Net payroll · ${mlabel(MO)}</small><div>${m(tot)}</div></div></div>
<div class="card"><h3>Quick start</h3><p class="mu">1. Add employees (or import a CSV) → 2. Record Attendance daily → 3. Approve Leave → 4. Open Payroll, pick the month, then print all payslips as PDF or send each by email.</p><div class="row"><button class="btn" onclick="V='att';R()">Record attendance</button><button class="btn s" onclick="V='pay';R()">Run payroll</button></div></div>`},
emp(){const d=emp(EDIT)||{};
return `<h1>Employees</h1><div class="card"><h3>${EDIT?'Edit':'Add'} employee</h3><div class="g"><div><label>Full name</label><input id="en" value="${e(d.name)}"></div><div><label>Position</label><input id="ep" value="${e(d.pos)}"></div><div><label>Email</label><input id="ee" type="email" value="${e(d.email)}"></div><div><label>Daily rate (₱)</label><input id="er" type="number" min="0" value="${e(d.rate)}"></div></div>
<div class="row"><button class="btn" onclick="saveEmp()">${EDIT?'Save changes':'Add employee'}</button>${EDIT?'<button class="btn s" onclick="EDIT=null;R()">Cancel</button>':''}<span class="mu">or import CSV (name,position,email,daily rate):</span><input type="file" accept=".csv,.txt" style="width:auto" onchange="imp(this)"></div></div>
<div class="card"><input placeholder="Search by name, position or email" oninput="flt(this.value)" style="margin-bottom:12px"><table><tr><th>Name</th><th>Position</th><th>Email</th><th class="r">Daily rate</th><th></th></tr>${S.emps.map(p=>`<tr class="er"><td>${e(p.name)}</td><td>${e(p.pos)}</td><td>${e(p.email)}</td><td class="r">${m(p.rate)}</td><td class="r"><button class="btn s sm" onclick="EDIT=${p.id};R();scrollTo(0,0)">Edit</button> <button class="btn r sm" onclick="del(${p.id})">${DEL==p.id?'Sure?':'Delete'}</button></td></tr>`).join('')||'<tr><td colspan=5 class="mu">No employees yet.</td></tr>'}</table></div>`},
att(){const D=S.att[DT]||{};
return `<h1>Attendance</h1><div class="card"><div class="row"><div><label>Date</label><input type="date" value="${DT}" onchange="DT=this.value;R()"></div><button class="btn o" style="margin-top:16px" onclick="allP()">Mark all present</button><span class="mu" style="margin-top:16px">Late after ${S.set.start}. Overtime counts beyond 8 working hours (1-hour lunch).</span></div>
<table><tr><th>Employee</th><th>Status</th><th>Time in</th><th>Time out</th><th>Hours</th><th>Late</th></tr>${S.emps.map(p=>{const r=D[p.id]||{st:'',in:'',out:''};const i=tm(r.in),o=tm(r.out);const h=i!=null&&o!=null?Math.max(0,(o-i-60)/60).toFixed(1):'–';const l=i!=null&&r.st==='P'?Math.max(0,i-tm(S.set.start)):0;
return `<tr><td>${e(p.name)}</td><td><select onchange="setA(${p.id},'st',this.value)">${[['','—'],['P','Present'],['A','Absent']].map(o=>`<option value="${o[0]}"${r.st===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></td><td><input type="time" value="${r.in}" onchange="setA(${p.id},'in',this.value)"></td><td><input type="time" value="${r.out}" onchange="setA(${p.id},'out',this.value)"></td><td>${h}</td><td>${l?l+' min':'–'}</td></tr>`}).join('')}</table></div>`},
lv(){return `<h1>Leave</h1><div class="card"><h3>File a leave request</h3><div class="g"><div><label>Employee</label><select id="le">${S.emps.map(p=>`<option value="${p.id}">${e(p.name)}</option>`).join('')}</select></div><div><label>Type</label><select id="lt"><option>Vacation</option><option>Sick</option><option>Emergency</option></select></div><div><label>From</label><input id="lf" type="date" value="${DT}"></div><div><label>To</label><input id="ltt" type="date" value="${DT}"></div><div><label>Reason</label><input id="lr"></div></div><button class="btn" onclick="addL()">Submit request</button></div>
<div class="card"><h3>Requests</h3><table><tr><th>Employee</th><th>Type</th><th>Dates</th><th>Days</th><th>Status</th><th></th></tr>${S.lv.map((l,i)=>`<tr><td>${e((emp(l.eid)||{}).name)}</td><td>${l.ty}</td><td>${l.f} → ${l.t}</td><td>${days(l.f,l.t).length}</td><td><span class="tag ${l.st}">${l.st}</span></td><td class="r">${l.st==='Pending'?`<button class="btn o sm" onclick="setL(${i},'Approved')">Approve</button> <button class="btn r sm" onclick="setL(${i},'Rejected')">Reject</button>`:`<button class="btn s sm" onclick="S.lv.splice(${i},1);save();R()">Remove</button>`}</td></tr>`).join('')||'<tr><td colspan=6 class="mu">No requests.</td></tr>'}</table></div>
<div class="card"><h3>Leave balance (${new Date().getFullYear()})</h3><table><tr><th>Employee</th><th>Remaining days</th></tr>${S.emps.map(p=>`<tr><td>${e(p.name)}</td><td>${bal(p.id)} / ${S.set.cred}</td></tr>`).join('')}</table></div>`},
pay(){const rows=S.emps.map(p=>({p,c:calc(p,MO)}));const T=k=>rows.reduce((a,x)=>a+x.c[k],0);
return `<h1>Payroll</h1><div class="card"><div class="row"><div><label>Pay period (month)</label><input type="month" value="${MO}" onchange="MO=this.value;R()"></div><button class="btn" style="margin-top:16px" onclick="show(S.emps.map(p=>p.id))">Print all payslips (PDF)</button><button class="btn s" style="margin-top:16px" onclick="csv()">Export CSV</button></div>
<table><tr><th>Employee</th><th>Days</th><th class="r">Gross</th><th class="r">Deductions</th><th class="r">Net pay</th><th></th></tr>${rows.map(x=>`<tr><td>${e(x.p.name)}</td><td>${x.c.P}${x.c.L?' + '+x.c.L+' leave':''}</td><td class="r">${m(x.c.gross)}</td><td class="r">${m(x.c.ded)}</td><td class="r"><b>${m(x.c.net)}</b></td><td class="r"><button class="btn s sm" onclick="show([${x.p.id}])">Payslip</button> <button class="btn sm" onclick="mail(${x.p.id})">✉ Email</button></td></tr>`).join('')}<tr><th>Total</th><th></th><th class="r">${m(T('gross'))}</th><th class="r">${m(T('ded'))}</th><th class="r">${m(T('net'))}</th><th></th></tr></table></div>
<p class="mu">Email opens your mail app with the payslip filled in. Contributions and tax are estimates — adjust rates in Settings.</p>`},
set(){const s=S.set;return `<h1>Settings</h1><div class="card"><div class="g"><div><label>Company name</label><input id="sc" oninput="dirty()" value="${e(S.co)}"></div><div><label>Work start time</label><input id="ss" oninput="dirty()" type="time" value="${s.start}"></div><div><label>Leave credits / year</label><input id="sl" oninput="dirty()" type="number" min="0" value="${s.cred}"></div><div><label>SSS employee %</label><input id="sp" oninput="dirty()" type="number" step=".1" min="0" value="${s.sss}"></div><div><label>PhilHealth employee %</label><input id="sh" oninput="dirty()" type="number" step=".1" min="0" value="${s.ph}"></div><div><label>Pag-IBIG employee %</label><input id="si" oninput="dirty()" type="number" step=".1" min="0" value="${s.pi}"></div></div><p class="mu">Rates are editable defaults (daily rate × 26 = monthly basis). Please verify against current government tables before real use. Data is saved in this browser only.</p><div class="row"><button class="btn" id="sv" onclick="saveSet()" disabled>Save changes</button><button class="btn s" onclick="backSet()">Back</button><span class="mu" id="sm"></span></div><button class="btn r" onclick="if(this.dataset.s){localStorage.removeItem(K);location.reload()}else{this.dataset.s=1;this.textContent='Click again to erase all data'}">Reset all data</button></div>
<div class="card"><h3>Change password</h3><p class="mu">Signed in as ${e(CU)}.</p><div class="g">${pwf('pc','Current password','current-password')}${pwf('pn','New password','new-password')}${pwf('pn2','Confirm new password','new-password')}</div><div class="row"><button class="btn" onclick="chgPw()">Update password</button><span class="mu" id="pm"></span></div></div>
<div class="card"><h3>Backup</h3><p class="mu">Download your employees, attendance and leave as a file, or restore from one.</p><div class="row"><button class="btn" onclick="bk()">Download backup</button><label class="btn s" style="margin:0;cursor:pointer;width:auto">Restore backup<input type="file" accept=".json" hidden onchange="rs(this)"></label></div></div>`}};
let DIRTY=false;
function dirty(){DIRTY=true;$('#sv').disabled=false;$('#sm').textContent='Unsaved changes'}
function saveSet(){const co=$('#sc').value.trim(),st=$('#ss').value,v=['sl','sp','sh','si'].map(i=>parseFloat($('#'+i).value));if(!co||!st||v.some(x=>!(x>=0))){alert('Enter a company name, a start time and valid numbers.');return}
S.co=co;S.set.start=st;S.set.cred=v[0];S.set.sss=v[1];S.set.ph=v[2];S.set.pi=v[3];save();DIRTY=false;$('#co').textContent=co;$('#sv').disabled=true;$('#sm').textContent='Settings saved'}
function backSet(){if(DIRTY&&!confirm('Discard your unsaved changes?'))return;DIRTY=false;V='dash';R();scrollTo(0,0)}
